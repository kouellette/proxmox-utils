name: hatch-fmt

on:
  push:
  pull_request:

jobs:
  fmt:
    name: Run hatch fmt --check
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install Hatch
        run: python -m pip install --upgrade pip hatch

      - name: Check formatting
        run: hatch fmt --check
